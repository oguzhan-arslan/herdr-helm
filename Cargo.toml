[package]
name = "herdr-helm"
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
description = "Helm: a tiled, project based multi-agent layout for Herdr"
license = "MIT"
repository = "https://github.com/oguzhan-arslan/herdr-helm"

[[bin]]
name = "herdr-helm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
